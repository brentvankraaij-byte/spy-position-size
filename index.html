<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPY Position Size Calculator</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#1e1e1e;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:350px;
    background:#2b2b2b;
    padding:25px;
    border-radius:12px;
    box-shadow:0 0 20px rgba(0,0,0,.4);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
}

input{
    width:100%;
    padding:10px;
    font-size:16px;
    border:none;
    border-radius:6px;
    background:#3a3a3a;
    color:white;
    box-sizing:border-box;
}

.result{
    margin-top:25px;
    background:#202020;
    padding:15px;
    border-radius:8px;
    text-align:center;
    font-size:18px;
    line-height:1.7;
}

.volume{
    font-size:34px;
    font-weight:bold;
    color:#4CAF50;
}
</style>
</head>

<body>

<div class="container">

<h2>SPY Position Size</h2>

<label>Account Balance (€)</label>
<input id="balance" type="number" value="1000">

<label>Risk (%)</label>
<input id="risk" type="number" step="0.1" value="1">

<label>Stop (TradingView Pips)</label>
<input id="stop" type="number" value="50">

<div class="result">
Risk Amount:<br>
<b>€<span id="riskAmount">10.00</span></b>

<br><br>

Volume:<br>
<div class="volume">
<span id="volume">20.00</span> Lots
</div>
</div>

</div>

<script>

function calculate(){

    const balance = parseFloat(document.getElementById("balance").value) || 0;
    const riskPercent = parseFloat(document.getElementById("risk").value) || 0;
    const stopPips = parseFloat(document.getElementById("stop").value) || 0;

    if(stopPips <= 0){
        document.getElementById("riskAmount").innerText = "0.00";
        document.getElementById("volume").innerText = "0.00";
        return;
    }

    // Money you want to risk
    const riskAmount = balance * riskPercent / 100;

    // TradingView "50 pips" = $0.50
    const stopDistance = stopPips / 100;

    // SPY CFD (Contract Size = 1)
    const volume = riskAmount / stopDistance;

    document.getElementById("riskAmount").innerText = riskAmount.toFixed(2);
    document.getElementById("volume").innerText = volume.toFixed(2);

}

document.querySelectorAll("input").forEach(input=>{
    input.addEventListener("input", calculate);
});

calculate();

</script>

</body>
</html>
