<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Risk Calculator">

    <link rel="apple-touch-icon" href="icon-v2.png">

    <title>Risk Calculator</title>

    <style>

        :root {
            --bg: #1e1e1e;
            --card: #2b2b2b;
            --input: #444;
            --result: #222;
            --blue: #4b82e8;
            --text: #ffffff;
            --muted: #bdbdbd;
        }

        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .card {
            width: 380px;
            max-width: 100%;
            background: var(--card);
            padding: 24px;
            border-radius: 22px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
        }

        h1 {
            text-align: center;
            margin: 0 0 22px;
            font-size: 34px;
        }

        h3 {
            margin: 0 0 10px;
            color: var(--muted);
            font-size: 20px;
        }

        .switch {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 14px;
        }

        .switch button {
            border: none;
            border-radius: 14px;
            background: #4a4a4a;
            color: #fff;
            padding: 14px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.15s ease;
        }

        .switch button.active {
            background: var(--blue);
        }

        label {
            display: block;
            font-size: 20px;
            font-weight: bold;
            margin: 16px 0 7px;
        }

        .box {
            display: flex;
            align-items: center;
            background: var(--input);
            border-radius: 14px;
            padding: 0 16px;
        }

        .symbol {
            font-size: 28px;
            font-weight: bold;
            margin-right: 10px;
            flex-shrink: 0;
        }

        input {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 27px;
            padding: 14px 0;
            outline: none;
        }

        input::placeholder {
            color: #a5a5a5;
            font-size: 21px;
        }

        /* Remove number arrows */

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }

        .exchange-section {
            display: block;
        }

        .result {
            margin-top: 22px;
            background: var(--result);
            border-radius: 18px;
            padding: 20px;
            text-align: center;
        }

        .small {
            font-size: 21px;
            color: #cfcfcf;
        }

        .money {
            font-size: 42px;
            font-weight: bold;
            margin: 6px 0;
        }

        hr {
            border: none;
            border-top: 1px solid #4b4b4b;
            margin: 20px 0;
        }

        .volume {
            font-size: 62px;
            font-weight: bold;
            color: var(--blue);
            line-height: 1;
            margin-top: 5px;
        }

        .lots {
            font-size: 28px;
            color: #cfcfcf;
            margin-top: 5px;
        }

        .rate-note {
            margin-top: 8px;
            font-size: 13px;
            color: #bdbdbd;
            text-align: center;
        }

        .rate-warning {
            margin-top: 8px;
            font-size: 13px;
            color: #e5bcbc;
            text-align: center;
        }

    </style>

</head>

<body>

    <div class="card">

        <h1>Risk Calculator</h1>

        <h3>Currency</h3>

        <div class="switch">
            <button type="button" id="eur">€ EUR</button>
            <button type="button" id="usd">$ USD</button>
        </div>


        <!-- ACCOUNT BALANCE -->

        <label>Account Balance</label>

        <div class="box">
            <div id="sym" class="symbol">€</div>

            <input
                id="balance"
                type="text"
                inputmode="numeric"
                autocomplete="off"
            >
        </div>


        <!-- EXCHANGE RATE -->

        <div id="exchangeSection" class="exchange-section">

            <label>Exchange Rate</label>

            <div class="box">

                <input
                    id="exchangeRate"
                    type="text"
                    inputmode="decimal"
                    autocomplete="off"
                    placeholder="EUR/USD exchange rate"
                >

            </div>

            <div class="rate-note">
                Example: 1.0850 means €1 = $1.0850
            </div>

        </div>


        <!-- RISK -->

        <label>Risk (%)</label>

        <div class="box">

            <input
                id="risk"
                type="text"
                inputmode="decimal"
                autocomplete="off"
            >

        </div>


        <!-- STOP -->

        <label>Stop (TradingView Pips)</label>

        <div class="box">

            <input
                id="stop"
                type="text"
                inputmode="decimal"
                autocomplete="off"
            >

        </div>


        <!-- RESULT -->

        <div class="result">

            <div class="small">Risk</div>

            <div id="riskAmount" class="money">
                €0,00
            </div>

            <hr>

            <div class="small">Volume</div>

            <div id="volume" class="volume">
                0.00
            </div>

            <div class="lots">
                Lots
            </div>

            <div
                id="warning"
                class="rate-warning"
                style="display:none;"
            >
                Enter the EUR/USD exchange rate
            </div>

        </div>

    </div>


    <script>

        /*
        =====================================
        SETTINGS
        =====================================
        */

        let currency =
            localStorage.getItem("currency") || "EUR";


        const balance =
            document.getElementById("balance");

        const risk =
            document.getElementById("risk");

        const stop =
            document.getElementById("stop");

        const exchangeRate =
            document.getElementById("exchangeRate");

        const exchangeSection =
            document.getElementById("exchangeSection");

        const warning =
            document.getElementById("warning");

        const eurButton =
            document.getElementById("eur");

        const usdButton =
            document.getElementById("usd");


        /*
        =====================================
        CURRENCY FUNCTIONS
        =====================================
        */

        function locale() {

            return currency === "EUR"
                ? "nl-NL"
                : "en-US";

        }


        function symbol() {

            return currency === "EUR"
                ? "€"
                : "$";

        }


        function balanceKey() {

            return currency === "EUR"
                ? "balance_eur"
                : "balance_usd";

        }


        /*
        =====================================
        FORMAT BALANCE
        =====================================
        */

        function formatBalance(number) {

            return new Intl.NumberFormat(
                locale(),
                {
                    maximumFractionDigits: 0
                }
            ).format(Number(number) || 0);

        }


        /*
        =====================================
        PARSE BALANCE
        Removes dots/commas from balance
        because balance is always whole money
        =====================================
        */

        function parseBalance(value) {

            return Number(

                String(value)
                    .replace(/[^0-9]/g, "")

            ) || 0;

        }


        /*
        =====================================
        PARSE DECIMAL
        Allows:
        1.0850
        1,0850
        =====================================
        */

        function parseDecimal(value) {

            if (!value) return 0;

            return Number(
                String(value)
                    .replace(",", ".")
                    .replace(/[^0-9.]/g, "")
            ) || 0;

        }


        /*
        =====================================
        FORMAT MONEY
        =====================================
        */

        function money(value) {

            return new Intl.NumberFormat(
                locale(),
                {
                    style: "currency",
                    currency: currency,
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }
            ).format(value);

        }


        /*
        =====================================
        UPDATE UI
        =====================================
        */

        function updateUI() {

            /*
            Currency symbol
            */

            document
                .getElementById("sym")
                .textContent = symbol();


            /*
            Currency buttons
            */

            eurButton.classList.toggle(
                "active",
                currency === "EUR"
            );

            usdButton.classList.toggle(
                "active",
                currency === "USD"
            );


            /*
            Show exchange rate only for EUR

            USD is already the base currency.
            */

            if (currency === "EUR") {

                exchangeSection.style.display =
                    "block";

            } else {

                exchangeSection.style.display =
                    "none";

                warning.style.display =
                    "none";

            }


            /*
            Load correct saved balance
            */

            const savedBalance =
                localStorage.getItem(balanceKey()) || 1000;


            balance.value =
                formatBalance(savedBalance);


            calculate();

        }


        /*
        =====================================
        MAIN CALCULATION
        =====================================
        */

        function calculate() {


            /*
            Read values
            */

            const bal =
                parseBalance(balance.value);

            const riskPercent =
                parseDecimal(risk.value);

            const stopPips =
                parseDecimal(stop.value);


            /*
            Save settings
            */

            localStorage.setItem(
                balanceKey(),
                bal
            );

            localStorage.setItem(
                "risk",
                risk.value
            );

            localStorage.setItem(
                "stop",
                stop.value
            );

            localStorage.setItem(
                "exchangeRate",
                exchangeRate.value
            );

            localStorage.setItem(
                "currency",
                currency
            );


            /*
            Format balance
            */

            if (bal > 0) {

                balance.value =
                    formatBalance(bal);

            }


            /*
            Calculate risk
            */

            const riskAmt =
                bal * riskPercent / 100;


            /*
            Display risk
            */

            document
                .getElementById("riskAmount")
                .textContent =
                    money(riskAmt);


            /*
            Stop must be valid
            */

            if (stopPips <= 0) {

                document
                    .getElementById("volume")
                    .textContent =
                        "0.00";

                warning.style.display =
                    "none";

                return;

            }


            /*
            =====================================
            USD ACCOUNT
            No conversion needed

            USD is the base currency.
            =====================================
            */

            let usdRiskAmount =
                riskAmt;


            /*
            =====================================
            EUR ACCOUNT

            Example:

            €10 risk
            EUR/USD = 1.0850

            €10 × 1.0850
            = $10.85 used for volume
            =====================================
            */

            if (currency === "EUR") {

                const rate =
                    parseDecimal(exchangeRate.value);


                /*
                No exchange rate entered
                */

                if (rate <= 0) {

                    document
                        .getElementById("volume")
                        .textContent =
                            "—";

                    warning.style.display =
                        "block";

                    return;

                }


                warning.style.display =
                    "none";


                usdRiskAmount =
                    riskAmt * rate;

            }


            /*
            =====================================
            CALCULATE VOLUME

            TradingView pip system:

            100 pips = $1 move

            So:

            stop / 100
            =====================================
            */

            const stopDistance =
                stopPips / 100;


            const volume =
                usdRiskAmount /
                stopDistance;


            /*
            Display volume
            */

            document
                .getElementById("volume")
                .textContent =
                    volume.toFixed(2);

        }


        /*
        =====================================
        EVENT LISTENERS
        =====================================
        */


        /*
        Balance formatting
        */

        balance.addEventListener(
            "input",
            function () {

                const numbers =
                    this.value.replace(/[^0-9]/g, "");

                if (numbers) {

                    this.value =
                        formatBalance(numbers);

                } else {

                    this.value = "";

                }


                calculate();

            }
        );


        /*
        Risk
        */

        risk.addEventListener(
            "input",
            calculate
        );


        /*
        Stop
        */

        stop.addEventListener(
            "input",
            calculate
        );


        /*
        Exchange rate
        */

        exchangeRate.addEventListener(
            "input",
            calculate
        );


        /*
        Select stop automatically
        */

        stop.addEventListener(
            "focus",
            function () {

                setTimeout(
                    () => this.select(),
                    50
                );

            }
        );


        /*
        EUR button
        */

        eurButton.addEventListener(
            "click",
            function () {

                currency = "EUR";

                localStorage.setItem(
                    "currency",
                    currency
                );

                updateUI();

            }
        );


        /*
        USD button
        */

        usdButton.addEventListener(
            "click",
            function () {

                currency = "USD";

                localStorage.setItem(
                    "currency",
                    currency
                );

                updateUI();

            }
        );


        /*
        =====================================
        LOAD SAVED SETTINGS
        =====================================
        */


        risk.value =
            localStorage.getItem("risk") || "1";


        stop.value =
            localStorage.getItem("stop") || "50";


        exchangeRate.value =
            localStorage.getItem("exchangeRate") || "";


        /*
        Start app
        */

        updateUI();


    </script>

</body>

</html>
