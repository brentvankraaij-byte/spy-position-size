<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Risk Calculator">

    <link rel="apple-touch-icon" href="icon-v2.png">

    <title>Risk Calculator V4</title>

    <style>
        :root {
            --bg: #1e1e1e;
            --card: #2b2b2b;
            --input: #444;
            --result: #222;
            --blue: #4b82e8;
            --text: #fff;
            --muted: #bdbdbd;
        }

        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            width: 380px;
            max-width: 100%;
            background: var(--card);
            padding: 28px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
        }

        h1 {
            text-align: center;
            margin: 0 0 28px;
            font-size: 42px;
        }

        h3 {
            margin: 0 0 10px;
            color: var(--muted);
        }

        .switch {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 20px;
        }

        .switch button {
            border: none;
            border-radius: 14px;
            background: #4a4a4a;
            color: #fff;
            padding: 16px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
        }

        .switch button.active {
            background: var(--blue);
        }

        label {
            display: block;
            font-size: 20px;
            font-weight: bold;
            margin: 22px 0 8px;
        }

        .box {
            display: flex;
            align-items: center;
            background: var(--input);
            border-radius: 14px;
            padding: 0 18px;
        }

        .symbol {
            font-size: 30px;
            font-weight: bold;
            margin-right: 10px;
        }

        input {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 30px;
            padding: 18px 0;
            outline: none;
        }

        /* Remove arrows from number inputs */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }

        .result {
            margin-top: 28px;
            background: var(--result);
            border-radius: 18px;
            padding: 24px;
            text-align: center;
        }

        .small {
            font-size: 22px;
            color: #cfcfcf;
        }

        .money {
            font-size: 46px;
            font-weight: bold;
            margin: 8px 0;
        }

        hr {
            border: none;
            border-top: 1px solid #4b4b4b;
            margin: 24px 0;
        }

        .volume {
            font-size: 72px;
            font-weight: bold;
            color: var(--blue);
            line-height: 1;
        }

        .lots {
            font-size: 30px;
            color: #cfcfcf;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Risk Calculator</h1>

        <h3>Currency</h3>

        <div class="switch">
            <button id="eur" class="active">€ EUR</button>
            <button id="usd">$ USD</button>
        </div>

        <label>Account Balance</label>

<div class="box">
    <div id="sym" class="symbol">€</div>
    <input
        id="balance"
        type="text"
        inputmode="numeric"
        autocomplete="off"
    >
</div>

<label>Exchange Rate</label>

<div class="box">
    <input
        id="exchangeRate"
        type="number"
        step="0.0001"
        inputmode="decimal"
        placeholder="EUR/USD exchange rate"
    >
</div>

<label>Risk (%)</label>

<div class="box">
    <input
        id="risk"
        type="number"
        step="0.1"
        inputmode="decimal"
    >
</div>

        <label>Stop (TradingView Pips)</label>

        <div class="box">
            <input
                id="stop"
                type="number"
                inputmode="decimal"
            >
        </div>

        <div class="result">

            <div class="small">Risk</div>
            <div id="riskAmount" class="money">€10,00</div>

            <hr>

            <div class="small">Volume</div>
            <div id="volume" class="volume">20.00</div>
            <div class="lots">Lots</div>

        </div>

    </div>


    <script>

        let currency = localStorage.getItem("currency") || "EUR";

        const balance = document.getElementById("balance");
        const risk = document.getElementById("risk");
        const stop = document.getElementById("stop");
        const exchangeRate = document.getElementById("exchangeRate");


        function locale() {
            return currency === "EUR" ? "nl-NL" : "en-US";
        }


        function symbol() {
            return currency === "EUR" ? "€" : "$";
        }


        function balanceKey() {
            return currency === "EUR"
                ? "balance_eur"
                : "balance_usd";
        }


        function format(n) {
            return new Intl.NumberFormat(locale(), {
                maximumFractionDigits: 0
            }).format(Number(n) || 0);
        }


        function parse(v) {
            return Number(
                String(v).replace(/[^0-9]/g, "")
            ) || 0;
        }


        function money(v) {
            return new Intl.NumberFormat(locale(), {
                style: "currency",
                currency: currency,
                minimumFractionDigits: 2
            }).format(v);
        }


        function updateUI() {

            document.getElementById("sym").textContent = symbol();

            document
                .getElementById("eur")
                .classList.toggle(
                    "active",
                    currency === "EUR"
                );

            document
                .getElementById("usd")
                .classList.toggle(
                    "active",
                    currency === "USD"
                );

            const saved =
                localStorage.getItem(balanceKey()) || 1000;

            balance.value = format(saved);

            calculate();
        }


        function calculate() {

            const bal = parse(balance.value);
            const r = Number(risk.value) || 0;
            const s = Number(stop.value) || 0;


            // Save settings

            localStorage.setItem(
                balanceKey(),
                bal
            );

            localStorage.setItem(
                "risk",
                risk.value
            );

            localStorage.setItem(
                "stop",
                stop.value
            );
            

            localStorage.setItem(
                "currency",
                currency
            );
            localStorage.setItem(
            "exchangeRate",
            exchangeRate.value
            );

            // Format balance

            balance.value = bal
                ? format(bal)
                : "";


            // Calculate risk amount

let usdRiskAmount = riskAmt;

if (currency === "EUR") {

    const rate =
        Number(exchangeRate.value) || 0;

    usdRiskAmount =
        riskAmt * rate;
}

const volume =
    usdRiskAmount / (s / 100);

            document.getElementById(
                "riskAmount"
            ).textContent = money(riskAmt);


            // Calculate volume

            if (s <= 0) {

                document.getElementById(
                    "volume"
                ).textContent = "0.00";

                return;
            }


            const volume =
                riskAmt / (s / 100);

            document.getElementById(
                "volume"
            ).textContent =
                volume.toFixed(2);
        }


        // Event listeners

        balance.addEventListener(
            "input",
            () => {

                balance.value =
                    format(
                        parse(balance.value)
                    );

                calculate();
            }
        );


        risk.addEventListener(
            "input",
            calculate
        );


        stop.addEventListener(
            "input",
            calculate
        );


        stop.addEventListener(
            "focus",
            () => stop.select()
        );
        exchangeRate.addEventListener(
            "input",
            calculate
        );


        // Currency buttons

        document.getElementById(
            "eur"
        ).onclick = () => {

            currency = "EUR";

            updateUI();
        };


        document.getElementById(
            "usd"
        ).onclick = () => {

            currency = "USD";

            updateUI();
        };


        // Load saved settings

        risk.value =
            localStorage.getItem("risk") || 1;

        stop.value =
            localStorage.getItem("stop") || 50;
        

exchangeRate.value =

    localStorage.getItem("exchangeRate") || "";


        updateUI();

    </script>

</body>
</html>
